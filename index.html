<!DOCTYPE html>
<html>
<head>
    <title>CycloWind Pro</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

<h1>CycloWind Pro</h1>
<div class="top-bar">
    <button id="startNavBtn" onclick="startNavigation()" style="background-color: #2ecc71; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer;">
        Démarrer
    </button>
    <button onclick="getRoute()">
        Calculer trajet
    </button>
    <button onclick="clearRoute()">Supprimer trajet</button>

    <!-- Settings toggle -->
    <button id="settingsToggleBtn" style="margin-left:8px;">Paramètres GPS</button>
</div>
  
<div class="search-box">
    <input id="destination" oninput="searchDestination()" placeholder="Entrer une destination">
    <div id="suggestions" style="background:white; position:absolute; z-index:1000; width:90%; max-height:200px; overflow:auto; border:1px solid #ccc;"></div>
</div>

<!-- Settings panel (hidden by default) -->
<div id="gpsSettingsPanel" style="display:none; position: fixed; right: 12px; top: 72px; width: 320px; background: rgba(255,255,255,0.95); border:1px solid #ccc; padding:12px; border-radius:8px; z-index:2000;">
    <h3 style="margin-top:0">Paramètres GPS</h3>

    <label>Lead time multiplier (s) — annonce anticipée:<br>
        <input type="number" id="leadTimeMultiplier" step="1" min="1" style="width:100%">
    </label>
    <br><br>

    <label>Seuil sortie (multiplicateur gpsAccuracy):<br>
        <input type="number" id="offRouteEnterMultiplier" step="0.1" min="0.5" style="width:100%">
    </label>
    <br><br>

    <label>Seuil retour (multiplicateur gpsAccuracy):<br>
        <input type="number" id="offRouteExitMultiplier" step="0.1" min="0.5" style="width:100%">
    </label>
    <br><br>

    <label>Nombre de relevés consécutifs pour déclarer sortie :<br>
        <input type="number" id="offRouteConsecutive" step="1" min="1" style="width:100%">
    </label>
    <br><br>

    <label>Cooldown alerte hors‑trajet (s) :<br>
        <input type="number" id="offRouteCooldownSec" step="1" min="5" style="width:100%">
    </label>
    <br><br>

    <label>Intervalle mise à jour GPS (ms) :<br>
        <input type="number" id="updateIntervalMs" step="50" min="50" style="width:100%">
    </label>
    <br><br>

    <div style="display:flex; gap:8px;">
        <button id="gpsSettingsSaveBtn" style="flex:1;">Enregistrer</button>
        <button id="gpsSettingsResetBtn" style="flex:1;">Restaurer défauts</button>
    </div>

    <p style="font-size:12px; color:#666; margin-top:8px">Les paramètres sont sauvegardés localement et prennent effet immédiatement.</p>
</div>

<div id="map"></div>

<!-- Bloc d'analyse du vent en bas à droite de la carte -->
<div class="wind-container-left">
    <button id="toggleRouteBtn">Voir la route alternative</button>
</div>

<div id="windInfo"></div>

<!-- Leaflet library first -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Utility functions -->
<script src="js/wind.js"></script>
<script src="js/bike.js"></script>
<script src="js/voice.js"></script>  
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/route.js"></script>

<!-- Settings helper: expose window.gpsSettings and UI bindings -->
<script>
(function(){
    const defaults = {
        leadTimeMultiplier: 12,
        offRouteEnterMultiplier: 2.5,
        offRouteExitMultiplier: 1.2,
        offRouteConsecutive: 2,
        offRouteCooldownMs: 30000,
        updateIntervalMs: 200
    };

    function load() {
        try { return JSON.parse(localStorage.getItem('gpsSettings')) || {}; } catch(e) { return {}; }
    }

    function save(s) { localStorage.setItem('gpsSettings', JSON.stringify(s)); }

    const stored = load();
    window.gpsSettings = Object.assign({}, defaults, stored);

    function setInputsFromSettings() {
        document.getElementById('leadTimeMultiplier').value = window.gpsSettings.leadTimeMultiplier;
        document.getElementById('offRouteEnterMultiplier').value = window.gpsSettings.offRouteEnterMultiplier;
        document.getElementById('offRouteExitMultiplier').value = window.gpsSettings.offRouteExitMultiplier;
        document.getElementById('offRouteConsecutive').value = window.gpsSettings.offRouteConsecutive;
        document.getElementById('offRouteCooldownSec').value = Math.round(window.gpsSettings.offRouteCooldownMs / 1000);
        document.getElementById('updateIntervalMs').value = window.gpsSettings.updateIntervalMs;
    }

    function applyFromInputs() {
        const s = window.gpsSettings;
        s.leadTimeMultiplier = Math.max(1, Number(document.getElementById('leadTimeMultiplier').value) || defaults.leadTimeMultiplier);
        s.offRouteEnterMultiplier = Math.max(0.5, Number(document.getElementById('offRouteEnterMultiplier').value) || defaults.offRouteEnterMultiplier);
        s.offRouteExitMultiplier = Math.max(0.5, Number(document.getElementById('offRouteExitMultiplier').value) || defaults.offRouteExitMultiplier);
        s.offRouteConsecutive = Math.max(1, parseInt(document.getElementById('offRouteConsecutive').value) || defaults.offRouteConsecutive);
        s.offRouteCooldownMs = Math.max(5000, (Number(document.getElementById('offRouteCooldownSec').value) || (defaults.offRouteCooldownMs/1000)) * 1000);
        s.updateIntervalMs = Math.max(50, parseInt(document.getElementById('updateIntervalMs').value) || defaults.updateIntervalMs);
        save(s);
        if (typeof window.onGpsSettingsChanged === 'function') window.onGpsSettingsChanged(s);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const panel = document.getElementById('gpsSettingsPanel');
        const toggle = document.getElementById('settingsToggleBtn');
        toggle.addEventListener('click', () => {
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            setInputsFromSettings();
        });

        document.getElementById('gpsSettingsSaveBtn').addEventListener('click', () => { applyFromInputs(); panel.style.display = 'none'; });
        document.getElementById('gpsSettingsResetBtn').addEventListener('click', () => { window.gpsSettings = Object.assign({}, defaults); save(window.gpsSettings); setInputsFromSettings(); if (typeof window.onGpsSettingsChanged === 'function') window.onGpsSettingsChanged(window.gpsSettings); });

        setInputsFromSettings();
    });
})();
</script>

<!-- 5. Navigation temps réel et suivi GPS (utilise la carte et les étapes de route) -->
<script src="js/gps.js?v=999"></script>


</body>
</html>
